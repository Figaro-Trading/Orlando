name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open the app
        2. Navigate to …
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. iOS 17, Android 14, macOS 15"

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "e.g. Safari 18, Chrome 124"

  - type: input
    id: node
    attributes:
      label: Node version (if building locally)
      placeholder: "e.g. 20.11.0"
